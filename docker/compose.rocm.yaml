name: ${PROJECT_NAME:-llm4proposal}

services:
  ollama:
    container_name: ${PROJECT_NAME:-llm4proposal}_ollama
    env_file: .env
    image: ollama/ollama:rocm
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama
    devices:
      - /dev/dri
      - /dev/kfd

  open-webui:
    container_name: ${PROJECT_NAME:-llm4proposal}_open-webui
    env_file: .env
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    volumes:
      - open-webui:/app/backend/data
    environment:
      - OLLAMA_BASE_URLS=http://ollama:11434

volumes:
  open-webui:
    name: ${PROJECT_NAME:-llm4proposal}_open-webui
  ollama:
    name: ${PROJECT_NAME:-llm4proposal}_ollama