name: ${PROJECT_NAME:-llm4proposal}

services:
  ollama:
    container_name: ${PROJECT_NAME:-llm4proposal}_ollama
    env_file: .env
    image: ollama/ollama{% if mode =="rocm" %}:rocm{% endif %}
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama
    {%- if mode == "rocm" %}
    devices:
      - /dev/dri
      - /dev/kfd
    {%- endif %}
    {%- if mode == "cuda" %}
    deploy:
      resources:
        reservations:
          devices:
            - driver: cpu
              count: all
              capabilities: [gpu]
    {%- endif %}

  open-webui:
    container_name: ${PROJECT_NAME:-llm4proposal}_open-webui
    env_file: .env
    image: ghcr.io/open-webui/open-webui:{% if mode == "cuda" %}cuda{% else %}main{% endif %}
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    volumes:
      - open-webui:/app/backend/data
    environment:
      - OLLAMA_BASE_URLS=http://ollama:11434
    {%- if mode == "cuda" %}
    deploy:
      resources:
        reservations:
          devices:
            - driver: cpu
              count: all
              capabilities: [gpu]
    {%- endif %}

volumes:
  open-webui:
    name: ${PROJECT_NAME:-llm4proposal}_open-webui
  ollama:
    name: ${PROJECT_NAME:-llm4proposal}_ollama
